# Disposable PostgreSQL and MariaDB instances for the local storage contract.
#
#   docker compose -f docker-compose.storage.yml up -d
#   bundle exec rake storage:contract
#   docker compose -f docker-compose.storage.yml down -v
#
# The credentials below are for these local test databases only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: bridge
      POSTGRES_USER: bridge
      POSTGRES_DB: bridge_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: bridge_test
      MARIADB_USER: bridge
      MARIADB_PASSWORD: bridge
      MARIADB_ROOT_PASSWORD: bridge
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
